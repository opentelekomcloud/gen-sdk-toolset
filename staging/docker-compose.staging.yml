# Staging stack for the scan panel: Caddy (auth + TLS + static bundle), the
# FastAPI backend, and PostgreSQL seeded from a dump of a local run.
#
# Staging, not production: one host, one shared password, no backups, no
# migration story for a live database, and the data is a copy of somebody's
# laptop. Production is expected to be a Kubernetes deployment, where the
# ingress takes over what Caddy does here.
#
# Differences from the development compose, and why:
#   * the frontend is a built bundle served by Caddy, not the Vite dev server;
#   * nothing is published except Caddy - the database and the backend are
#     reachable only inside the compose network;
#   * GITHUB_TOKEN is deliberately absent by default. Reading the panel needs no
#     token; a scan started on this host would spend the quota of whatever token
#     is put here, so it is opt-in, not the default.
#
# Usage is in deploy/README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-panel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      - POSTGRES_DB=${POSTGRES_DB:-panel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Restored once, on an empty data directory: the panel arrives with the
      # services and generations that were scanned locally.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panel} -d ${POSTGRES_DB:-panel}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE__URL=postgresql+psycopg://${POSTGRES_USER:-panel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-panel}
      # Same origin behind Caddy, so no cross-origin request is ever made.
      - PANEL__FRONTEND_ORIGIN=${SITE_URL:-http://localhost}
      # Uncomment only if scans should run on this host:
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: ../staging/Dockerfile.frontend
    ports:
      # Published ports are configurable so the same stack can run on a laptop
      # (behind an ngrok tunnel, on 8080) and on the host that owns 80/443.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS (a domain, or :80 without one)}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Login and bcrypt hash, mounted verbatim - see deploy/auth.caddy.example.
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
