# Staging stack for the scan panel: Caddy (auth + TLS + static bundle), the
# FastAPI backend, and PostgreSQL seeded from a dump of a local run.
#
# Staging, not production: one host, one shared password, no backups, no
# migration story for a live database, and the data is a copy of somebody's
# laptop. Production is expected to be a Kubernetes deployment, where the
# ingress takes over what Caddy does here.
#
# Differences from the development compose, and why:
#   * the frontend is a built bundle served by Caddy, not the Vite dev server;
#   * nothing is published except Caddy - the database and the backend are
#     reachable only inside the compose network;
#   * the backend gets no GITHUB_TOKEN. Reading the panel needs none, and a scan
#     started on this host would spend the quota of whatever token it held. The
#     scheduled `discovery` service below does get one - it only refreshes marks
#     and starts no scan, which is the whole reason the token sits there and not
#     on the API server.
#
# Usage is in deploy/README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-panel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      - POSTGRES_DB=${POSTGRES_DB:-panel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Restored once, on an empty data directory: the panel arrives with the
      # services and snapshots that were scanned locally.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panel} -d ${POSTGRES_DB:-panel}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    # Named so the scheduled discovery below can run this exact build instead
    # of a second one of its own.
    image: gen-sdk-panel:staging
    environment:
      - DATABASE__URL=postgresql+psycopg://${POSTGRES_USER:-panel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-panel}
      # Same origin behind Caddy, so no cross-origin request is ever made.
      - PANEL__FRONTEND_ORIGIN=${SITE_URL:-http://localhost}
      # The API authenticates every request itself now; Caddy's shared password
      # is a second door in front of it, not the only one.
      - AUTH__ISSUER=${AUTH__ISSUER:-}
      - AUTH__AUDIENCE=${AUTH__AUDIENCE:-}
      # Uncomment only if scans should run on this host:
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One discovery pass: registry upsert plus branch HEAD refresh, no scan Job
  # ever. Not started by `up` - `--profile sync` keeps it out of the way until
  # the host's cron entry runs it (README.md).
  #
  # This is where GITHUB_TOKEN goes, and deliberately not on the backend: a
  # scheduled sync can then read GitHub while a rescan launched from the UI on
  # this host still cannot, which is the split the header above describes.
  discovery:
    profiles: ["sync"]
    # The image the backend is already running - `up --build` refreshes both at
    # once. A build of its own would sit at whatever code it was last built
    # from, and a sync silently reading an older registry than the panel serves
    # is exactly the kind of drift this whole feature exists to remove.
    image: gen-sdk-panel:staging
    # It is built here or not at all, so a missing one is "bring the stack up",
    # not a registry that has never heard of us.
    pull_policy: never
    command: ["uv", "run", "panel", "discover"]
    environment:
      - DATABASE__URL=postgresql+psycopg://${POSTGRES_USER:-panel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-panel}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    # A pass that fails is reported by its exit code and picked up by the next
    # run; restarting it here would retry against the rate limit that stopped it.
    restart: "no"

  web:
    build:
      context: ../frontend
      dockerfile: ../staging/Dockerfile.frontend
    ports:
      # Published ports are configurable so the same stack can run on a laptop
      # (behind an ngrok tunnel, on 8080) and on the host that owns 80/443.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS (a domain, or :80 without one)}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Login and bcrypt hash, mounted verbatim - see deploy/auth.caddy.example.
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
