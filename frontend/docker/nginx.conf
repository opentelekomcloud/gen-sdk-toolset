# Static bundle of the panel. TLS and the /api route belong to the ingress.
# 8080, not 80: the hardened nginx image runs unprivileged.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Not ours: the ingress sends /api to the backend. Answering 404 here keeps
    # a misrouted API call from being served the SPA shell with a 200.
    location /api/ {
        return 404;
    }

    # Written from the environment at every start (docker/panel-config.sh), so
    # it lives outside the bundle and must never be cached across a redeploy
    # that changed the Zitadel application.
    location = /config.js {
        alias /tmp/panel/config.js;
        add_header Cache-Control "no-cache";
    }

    # Vite names bundle files by content hash; a changed file is a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: a deep link is served the shell and resolved there.
    location / {
        try_files $uri /index.html;
    }
}
