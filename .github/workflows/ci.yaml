name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Check architecture boundaries (domain must not import infrastructure)
        run: lint-imports

  tests:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync --extra dev --extra panel --frozen

      - name: Run Python tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: >-
          uv run pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml

      - name: Check pull request diff coverage
        if: github.event_name == 'pull_request'
        run: >-
          uv run diff-cover coverage.xml
          --config-file pyproject.toml
          --compare-branch="origin/${{ github.base_ref }}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend lint, build, tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ODS packages come from the Telekom Artifactory npm registry. the credential is the
      # organization's JFrog service account (ARTIFACTORY_AUTH_*), written as
      # npm basic auth into the runner's user-level npm config so it never
      # touches the checkout. GitHub masks the secrets but not a value derived
      # from them, hence the explicit mask on the base64 form.
      - name: Authenticate to the ODS npm registry
        env:
          ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          npm config set --location=user "//artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/:_auth" "$auth"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  artifacts:
    name: Generated API artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Authenticate to the ODS npm registry
        env:
          ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          npm config set --location=user "//artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/:_auth" "$auth"

      # The install the setup docs prescribe, from both lockfiles: the artifacts
      # are only reproducible against the dependency set that produced them, and
      # a resolver free to pick a newer FastAPI or openapi-typescript would
      # report a diff nobody introduced.
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra panel --frozen
          npm --prefix frontend ci

      # The schema is built from the app object, not from a running server, so
      # this job needs neither the database nor a GitHub token.
      - name: Regenerate the OpenAPI schema
        run: uv run panel openapi > src/tools/panel/openapi.json

      - name: Regenerate the frontend types
        run: npm --prefix frontend run gen:types

      - name: Fail if either artifact is out of date
        run: |
          if ! git diff --exit-code -- src/tools/panel/openapi.json frontend/src/shared/api/schema.gen.ts; then
            echo "::error::The committed artifacts do not match the code. Run both, in this order, and commit the result:"
            echo "::error::  uv run panel openapi > src/tools/panel/openapi.json"
            echo "::error::  cd frontend && npm run gen:types"
            exit 1
          fi

  check:
    name: check
    if: >
      always()
    needs: [lint, tests, frontend, artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
