# Builds and pushes both images when a tag is pushed or a release is published,
# then records an SBOM of each in Dependency-Track. The registry host is the
# organization variable REGISTRY, its credentials are organization secrets;
# nothing here names a host.
#
# A tag `v1.2.3` becomes `<registry>/opentelekomcloud/sdk-panel:v1.2.3` and
# `.../sdk-panel-frontend:v1.2.3` - one version for the pair, since the
# frontend's generated types are pinned to the backend's schema.
name: Docker Image Build on tag or release

on:
  push:
    tags:
      - '*'
  release:
    types:
      - published

env:
  ORG: opentelekomcloud

jobs:
  push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sdk-panel
            context: .
            dockerfile: Dockerfile.backend
          - image: sdk-panel-frontend
            context: ./frontend
            dockerfile: Dockerfile.frontend

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            "${{ vars.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}"
          tags: |
            type=semver,pattern={{version}},prefix=v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Choose image ref and version for the SBOM
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${version}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: "v0.69.3"
          scan-type: image
          image-ref: "${{ steps.ref.outputs.image }}"
          format: cyclonedx
          output: bom.json
          exit-code: 0
          scanners: vuln

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ secrets.DEPENDENCYTRACK_PREPROD_HOSTNAME }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_PREPROD_APIKEY }}
          projectName: "${{ env.ORG }}/${{ matrix.image }}"
          projectVersion: "${{ steps.ref.outputs.version }}"
          bomFilename: "bom.json"
          autoCreate: true
