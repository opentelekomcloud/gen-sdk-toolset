# Builds and pushes both images to SWR when a tag is pushed or a release is
# published, then records an SBOM of each in Dependency-Track. Follows
# opentelekomcloud-infra/circle-partner-navigator-frontend: base images from
# Artifactory, the result into SWR under t-cloud-public; every host and
# credential is an organization secret.
#
# A tag `v1.2.3` becomes `<SWR>/t-cloud-public/sdk-panel:v1.2.3` and
# `.../sdk-panel-frontend:v1.2.3` - one version for the pair, since the
# frontend's generated types are pinned to the backend's schema.
name: Docker Image Build on tag or release

on:
  push:
    tags:
      - '*'
  release:
    types:
      - published

env:
  SWR_NAMESPACE: t-cloud-public

jobs:
  push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sdk-panel
            context: .
            dockerfile: Dockerfile.backend
          - image: sdk-panel-frontend
            context: ./frontend
            dockerfile: Dockerfile.frontend

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            "${{ secrets.SWR_URL }}/${{ env.SWR_NAMESPACE }}/${{ matrix.image }}"
          tags: |
            type=semver,pattern={{version}},prefix=v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_URL }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Login to Artifactory DHI
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACTORY_URL }}
          username: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}

      # The ODS npm credential for Dockerfile.frontend (issue #135): an npmrc
      # line with the JFrog service account as basic auth, in the runner's temp
      # directory, which is discarded with the job. GitHub masks the secrets
      # but not a value derived from them, hence the explicit mask.
      - name: Write the ODS npm credential
        env:
          ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          printf '//artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/:_auth=%s\n' "$auth" > "$RUNNER_TEMP/ods_npmrc"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Plain image manifests: SWR does not take the attestation
          # manifests buildx attaches by default.
          provenance: false
          sbom: false
          build-args: |
            ARTIFACTORY_URL=${{ secrets.ARTIFACTORY_URL }}
          # the ODS npm credential, mounted for `npm ci` only
          # (Dockerfile.frontend); the backend build ignores it
          secret-files: |
            ods_npmrc=${{ runner.temp }}/ods_npmrc

      - name: Choose image ref and version for the SBOM
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.SWR_URL }}/${{ env.SWR_NAMESPACE }}/${{ matrix.image }}:${version}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: "v0.69.3"
          scan-type: image
          image-ref: "${{ steps.ref.outputs.image }}"
          format: cyclonedx
          output: bom.json
          exit-code: 0
          scanners: vuln

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ secrets.DEPENDENCYTRACK_PREPROD_HOSTNAME }}
          apiKey: ${{ secrets.DEPENDENCYTRACK_PREPROD_APIKEY }}
          projectName: "opentelekomcloud/${{ matrix.image }}"
          projectVersion: "${{ steps.ref.outputs.version }}"
          bomFilename: "bom.json"
          autoCreate: true
