# Builds both images on every pull request without pushing them: a Dockerfile
# that no longer builds is a red check here rather than a failed release.
#
# The base images come from the organization's Artifactory, so the build
# needs the organization secrets - a pull request from a fork cannot run it.
name: Docker Image Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

env:
  ORG: opentelekomcloud

jobs:
  build:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sdk-panel
            context: .
            dockerfile: Dockerfile.backend
          - image: sdk-panel-frontend
            context: ./frontend
            dockerfile: Dockerfile.frontend

    steps:
      - uses: actions/checkout@v4

      - name: Login to Artifactory DHI
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ARTIFACTORY_URL }}
          username: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.ORG }}/${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The ODS npm credential for Dockerfile.frontend (issue #135): an npmrc
      # line with the JFrog service account as basic auth, in the runner's temp
      # directory, which is discarded with the job. GitHub masks the secrets
      # but not a value derived from them, hence the explicit mask.
      - name: Write the ODS npm credential
        env:
          ARTIFACTORY_AUTH_USERNAME: ${{ secrets.ARTIFACTORY_AUTH_USERNAME }}
          ARTIFACTORY_AUTH_PASSWORD: ${{ secrets.ARTIFACTORY_AUTH_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$ARTIFACTORY_AUTH_USERNAME" "$ARTIFACTORY_AUTH_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          printf '//artifactory.devops.telekom.de/artifactory/api/npm/one-design-system-npm/:_auth=%s\n' "$auth" > "$RUNNER_TEMP/ods_npmrc"

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: false
          build-args: |
            ARTIFACTORY_URL=${{ secrets.ARTIFACTORY_URL }}
          # the ODS npm credential, mounted for `npm ci` only
          # (Dockerfile.frontend); the backend build ignores it
          secret-files: |
            ods_npmrc=${{ runner.temp }}/ods_npmrc
