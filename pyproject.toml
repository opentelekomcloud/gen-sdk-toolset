[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gen-sdk-tooling"
version = "0.1.0"
description = "Automated Python SDK generation from OTC API documentation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "requests>=2.32,<3",
    "docutils>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15",
    "import-linter>=2.0",
    "pytest-cov>=6,<8",
    "diff-cover[toml]>=9,<10",
    "httpx>=0.27,<1",
    "testcontainers[postgres]>=4.0,<5",
]
panel = [
    "fastapi",
    "sqlalchemy>=2.0",
    "alembic",
    "uvicorn",
    "psycopg[binary]>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]

[tool.importlinter]
root_package = "tools"

[[tool.importlinter.contracts]]
name = "the scanner does not depend on the panel"
type = "forbidden"
source_modules = ["tools.scanner"]
forbidden_modules = ["tools.panel"]

[[tool.importlinter.contracts]]
name = "panel analytics is pure (no persistence, no HTTP, no scanner)"
type = "forbidden"
source_modules = ["tools.panel.core.analytics"]
forbidden_modules = ["tools.panel.core.db", "tools.panel.api", "tools.scanner"]

[[tool.importlinter.contracts]]
name = "shared is a leaf (imports nothing internal)"
type = "forbidden"
source_modules = ["tools.shared"]
forbidden_modules = ["tools.scanner", "tools.panel"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.diff_cover]
fail_under = 80

[project.scripts]
gen-sdk-scan = "tools.scanner.main:main"
panel = "tools.panel.cli:main"
